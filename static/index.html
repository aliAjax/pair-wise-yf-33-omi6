<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>卫星地面站排程台</title>
<style>body{font:15px system-ui;max-width:1100px;margin:40px auto;background:#eef5f7;padding:0 20px;color:#102a43}section{background:white;padding:20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 12px #0001}pre{background:#071827;color:#67e8f9;padding:16px;border-radius:8px;overflow:auto}input,button,textarea{font:inherit;padding:8px;margin:4px}button{background:#0369a1;color:white;border:0;border-radius:6px}textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,monospace}.hold{border-bottom:1px solid #dbe5ec;padding:6px 0}</style>
<h1>卫星地面站排程台</h1><p>查看请求、接收排程与站点状态。写入使用 JSON API，身份由 X-User-Id、X-Role 和租户头提供。</p><section><input id="u" value="operator"><input id="r" value="operator"><button onclick="load()">刷新</button><pre id="o"></pre></section>
<section><h2>临时占位</h2><p>把若干请求整批占位到同一站的天线：核对可见窗口、维护、同星接收、已有排程和租户配额，任一冲突整批不入库；到期未转换自动释放；转换时重新核验，失败保留占位。</p>
<div><input id="hs" placeholder="地面站 ID"><input id="ha" placeholder="天线 ID"><input id="he" placeholder="过期时间 ISO 8601" size="26"></div>
<textarea id="hi" rows="4" placeholder='[{"request_id":1,"window_id":1,"starts_at":"2026-01-01T00:00:00Z","ends_at":"2026-01-01T00:30:00Z","rate_mbps":50}]'></textarea>
<div><button onclick="createHolds()">创建占位批次</button><button onclick="loadHolds()">查询占位</button></div>
<div id="hl"></div><pre id="ho"></pre></section>
<script>
function hdrs(){return {'Content-Type':'application/json','X-User-Id':u.value,'X-Role':r.value}}
async function load(){let x=await fetch('/api/state',{headers:{'X-User-Id':u.value,'X-Role':r.value}});o.textContent=JSON.stringify(await x.json(),null,2)}
async function loadHolds(){let x=await fetch('/api/holds',{headers:hdrs()});let d=await x.json();ho.textContent=JSON.stringify(d,null,2);hl.innerHTML=(d.holds||[]).map(h=>`<div class="hold">#${h.id} [${h.status}] 请求${h.request_id} ${h.station_id}/${h.antenna_id} ${h.starts_at} ~ ${h.ends_at} 过期 ${h.expires_at} <button onclick="holdAction(${h.id},'convert')">转换</button><button onclick="holdAction(${h.id},'cancel')">取消</button></div>`).join('')}
async function createHolds(){let items;try{items=JSON.parse(hi.value)}catch(e){ho.textContent='items 不是有效 JSON';return}let x=await fetch('/api/holds',{method:'POST',headers:hdrs(),body:JSON.stringify({station_id:hs.value,antenna_id:ha.value,expires_at:he.value,items})});ho.textContent=JSON.stringify(await x.json(),null,2);loadHolds()}
async function holdAction(id,action){let body={};if(action==='cancel'){let reason=prompt('取消原因');if(!reason)return;body={reason}}let x=await fetch('/api/holds/'+id+'/'+action,{method:'POST',headers:hdrs(),body:JSON.stringify(body)});ho.textContent=JSON.stringify(await x.json(),null,2);loadHolds()}
load();loadHolds()
</script>
